<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAML error</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-mtime="{{ mtime }}">
  <main class="error-page">
    <h1>Could not parse main.yaml</h1>
    <p class="error-message">{{ message }}</p>
    {% if line %}
    <p class="error-location">Line {{ line }}, column {{ column }}</p>
    {% endif %}
    {% if snippet %}
    <pre class="error-snippet">{{ snippet }}</pre>
    {% endif %}
    <p class="error-hint">Fix the file and this page will reload automatically.</p>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
